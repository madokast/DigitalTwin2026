/api/telegram/probe:
  post:
    operationId: telegramProbe
    tags: [telegram]
    summary: Send a Telegram probe message
    description: |
      Requires `TELEGRAM_BOT_TOKEN` and `TELEGRAM_USER_ID` on the server.
      Empty body is allowed and sends the default text `DigitalTwin2026 probe`;
      a non-empty body must be a JSON object with optional `text`
      (malformed JSON or trailing garbage → 400).
      Auth: ApiToken.
    security:
      - ApiToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TelegramProbeRequest'
    responses:
      '200':
        description: Message sent
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessOnly'
      '400':
        description: Telegram env not configured, malformed JSON, or unknown JSON key
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '502':
        description: Telegram Bot API sendMessage failed
        $ref: '../components/responses.yaml#/BadGateway'
