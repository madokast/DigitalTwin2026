/api/log/numbers:
  post:
    operationId: logNumbers
    tags: [log]
    summary: Create a batch of numeric records sharing one timestamp
    description: |
      Inserts one or more records (1..100) with `numeric_value` set and
      `raw_content` null, all sharing `happened_at`. Each entry `memo` maps
      to `objective_context` (DB NOT NULL). Committed atomically in a single
      transaction. On success, one batch notification via notify_user is
      always scheduled (best-effort) and does not change the 201 response.
      Auth: ApiToken (AI token or Admin token).
      Reserved tag prefixes (`transaction_entry` / `transaction_entry:*`,
      `body:weight` / `body:weight:*`, `todo` / `todo:*`, `review` /
      `review:*`) are rejected (use the dedicated log endpoints).
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogNumberRequest'
          example:
            happened_at: '2026-07-30T08:00:00+08:00'
            entries:
              - numeric_value: '8000'
                memo: daily step count
                tags: [steps]
              - numeric_value: '36.8'
                memo: axillary temperature
                ai_analysis: good pace
    responses:
      '201':
        description: Batch committed
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/NumberBatchSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/log/body/weight:
  post:
    operationId: logBodyWeight
    tags: [log]
    summary: Create a body-weight record (kg)
    description: |
      Inserts a numeric record with `numeric_value` as kg (no unit field)
      and `raw_content` null. Server always prepends reserved tag
      `body:weight` (optional client `tags` follow). Reserved prefixes
      `body:weight` / `body:weight:*`, `transaction_entry` /
      `transaction_entry:*`, and `todo` / `todo:*` are rejected on client tags.
      On success, notification via notify_user is always scheduled
      (best-effort) and does not change the 201 response.
      Auth: ApiToken (AI token or Admin token).
      Query later with `GET /api/query?tag=body:weight` (no dedicated
      trend/summary endpoint).
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogBodyWeightRequest'
          example:
            happened_at: '2026-08-02T08:00:00+08:00'
            numeric_value: '75.5'
            objective_context: morning weigh-in
            ai_analysis: a bit heavy
            tags: [morning]
    responses:
      '201':
        description: Record created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RecordSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/log/todo:
  post:
    operationId: logTodo
    tags: [log]
    summary: Create a to-do record
    description: |
      Inserts a text-like record with `raw_content` from request `content` and
      `happened_at` from request `created_at` (`numeric_value` null). Server
      always prepends reserved state tag `todo:in_progress` (optional client
      `tags` follow). Clients must not send reserved tags
      (`todo` / `todo:*`, `transaction_entry` / `transaction_entry:*`,
      `body:weight` / `body:weight:*`) and must not send `happened_at` /
      `raw_content` / `numeric_value` keys (use aliases). Success `201.record`
      is a **TodoRecord** (`created_at` / `content`, not `happened_at` /
      `raw_content`). On success, notification via notify_user is always
      scheduled (best-effort) and does not change the 201 response.
      Auth: ApiToken (AI token or Admin token).
      Query later with `GET /api/query?tag=todo:in_progress` (list items also
      use TodoRecord aliases when tags include a todo state tag).
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogTodoRequest'
          example:
            created_at: '2026-08-02T10:00:00+08:00'
            content: Buy milk
            objective_context: weekend grocery list
            tags: [errand]
    responses:
      '201':
        description: To-do created (record uses TodoRecord aliases)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TodoRecordSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/log/todo/transition:
  post:
    operationId: logTodoTransition
    tags: [log]
    summary: Transition a to-do state
    description: |
      Atomically replaces the to-do's representative `todo:{state}` tag with
      `todo:{target}` and inserts an audit text row tagged `todo:transition`
      (raw_content per feature spec §4.1). Success is HTTP **200** with
      `{ success, id, transition: { from, to } }` (TodoState literals; no
      `record` / `audit_record`). Notify exactly once with the audit
      raw_content. Four distinct English
      errors: not found (404), not a to-do / audit / already target (400).
      Auth: ApiToken (AI token or Admin token).
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogTodoTransitionRequest'
          example:
            id: '01900000-0000-7000-8000-000000000003'
            target: completed
            happened_at: '2026-08-02T12:00:00+08:00'
    responses:
      '200':
        description: To-do transitioned (no record payloads)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TodoTransitionSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: No to-do row with this id
        $ref: '../components/responses.yaml#/NotFound'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/log/text:
  post:
    operationId: logText
    tags: [log]
    summary: Create a text record
    description: |
      Inserts a record with `raw_content` set and `numeric_value` null.
      On success, notification via notify_user is always scheduled (best-effort) and does not change the 201 response.
      Auth: ApiToken (AI token or Admin token).
      Reserved tag prefixes (`transaction_entry` / `transaction_entry:*`,
      `body:weight` / `body:weight:*`, `todo` / `todo:*`) are rejected (use the dedicated
      log endpoints).
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogTextRequest'
          example:
            happened_at: '2026-07-30T10:00:00+08:00'
            raw_content: studied 50 words
            objective_context: afternoon study
            tags: [study, vocabulary]
    responses:
      '201':
        description: Record created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RecordSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/log/review:
  post:
    operationId: logReview
    tags: [log]
    summary: Create a review record
    description: |
      Inserts a text record with `raw_content` set and `numeric_value` null.
      Required `cadence` enum (`daily` | `weekly` | `monthly` | `quarterly`
      | `semiannually` | `yearly`); the server always prepends reserved tag
      `review:{cadence}` (optional client `tags` follow). Clients must not
      send `review` / `review:*` tags (reserved prefix) nor `numeric_value` /
      `utc_offset` (unknown keys → 400). Review records are ordinary records
      queryable via `GET /api/query?tag=review:{cadence}`.
      On success, notification via notify_user is always scheduled
      (best-effort) and does not change the 201 response.
      Auth: ApiToken (AI token or Admin token).
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ReviewRequest'
          example:
            happened_at: '2026-08-09T19:00:00+08:00'
            cadence: weekly
            raw_content: This week I slept better and finished the report.
            objective_context: Weekly review covering 2026-08-03..2026-08-09
            ai_analysis: Deeper work in the morning helped.
            tags: [work]
    responses:
      '201':
        description: Record created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RecordSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/log/transactions:
  post:
    operationId: logTransactions
    tags: [log]
    summary: Log one spend/income event with one or more line entries
    description: |
      Records an already-occurred money event. Required top-level `type`
      (`income` | `expense`) applies to the whole request; mixed directions
      need two calls. Body is always a batch via `entries` (length 1 for a
      single line). Shared `happened_at` for all lines.
      Each line becomes one DB row with tags
      `transaction_entry:{type}` plus `{category}:{subcategory}`.
      Amount zero after decimal validation → 400. Sign: positive = normal
      for that type; negative = reversal of that type.
      Response is only `{ success, inserted }` (no full records).
      On success, notification via notify_user is always scheduled (best-effort).
      Opinions/feelings about the spend → separate POST /api/log/text.
      Auth: ApiToken.
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogTransactionsRequest'
          example:
            happened_at: '2026-08-01T12:30:00+08:00'
            type: expense
            entries:
              - amount: '25.00'
                memo: beef noodle lunch
                category: food
                subcategory: lunch
              - amount: '12.50'
                memo: box of tissues
                category: food
                subcategory: grocery
    responses:
      '201':
        description: Entries inserted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TransactionBatchSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
