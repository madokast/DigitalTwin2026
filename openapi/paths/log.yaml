/api/log/transaction:
  post:
    operationId: logTransaction
    tags: [log]
    summary: Log one spend/income event with one or more line entries
    description: |
      Records an already-occurred money event. Body is always a batch via `entries`
      (length 1 for a single line). Shared `happened_at` for all lines.
      Each line becomes one DB row with reserved tag `transaction_entry` plus
      `{category}:{subcategory}`. Response is only `{ success, inserted }` (no full records).
      Opinions/feelings about the spend → separate POST /api/log/text.
      Auth: ApiToken.
    security:
      - ApiToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LogTransactionRequest'
          example:
            happened_at: '2026-08-01T12:30:00+08:00'
            entries:
              - amount: '25.00'
                memo: beef noodle lunch
                category: food
                subcategory: lunch
              - amount: '12.50'
                memo: box of tissues
                category: food
                subcategory: grocery
    responses:
      '201':
        description: Entries inserted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TransactionBatchSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
