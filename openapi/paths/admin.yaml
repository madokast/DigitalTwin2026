/api/admin/records/stats:
  get:
    operationId: adminRecordsStats
    tags: [admin]
    summary: Total and today record counts for an IANA time zone
    description: |
      Frontend dashboard counts (`total` all-time records, `today` records
      whose `happened_at` falls in the calendar day of "now" in the given
      IANA zone `[start, end)`). Not for AI use, so it lives under
      `/api/admin/*` (AdminToken only) rather than the ApiToken `/api/query/*`
      namespace.
      Auth: **AdminToken only**.
    security:
      - AdminToken: []
    parameters:
      - name: tz
        in: query
        required: true
        description: |
          Valid IANA time zone accepted by both backends (Intl ∩ Go tzdata),
          e.g. `UTC`, `Asia/Shanghai`. Rejected: Go-only names (`Factory` /
          `localtime` / `posixrules`) and Intl-only names Go cannot load
          (e.g. `America/Coyhaique`) → 400.
        schema:
          type: string
          examples:
            - UTC
            - Asia/Shanghai
    responses:
      '200':
        description: Counts
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SummarySuccess'
      '400':
        description: Missing or invalid `tz`
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/admin/tags/normalize:
  post:
    operationId: adminNormalizeTag
    tags: [admin]
    summary: Merge a tag set into one canonical tag across all records
    description: |
      Search normalization (replaces the former tags/rename; rename is the
      single-source case `from: [A]`). In each record's tags JSON, every
      tag listed in `from` is removed in place (remaining order kept) and
      `to` is kept at its existing position or appended at the tail; exact
      duplicates are removed. `updated` is the number of records whose tags
      string actually changed (a record matching several `from` tags counts
      once). One DB transaction + advisory lock; any error rolls back.
      Reserved tag prefixes (`transaction_entry` / `transaction_entry:*`,
      `body:weight` / `body:weight:*`, `todo` / `todo:*`, `review` /
      `review:*`) are rejected for both `from` elements and `to`; `to` must
      not be in `from`; `from` must be non-empty without duplicates.
      Auth: **AdminToken only** (destructive full-table operation).
    security:
      - AdminToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/NormalizeTagsRequest'
          example:
            from: [exercise, workout, training]
            to: workout
    responses:
      '200':
        description: Normalization applied
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/NormalizeTagsSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/admin/import/records:
  post:
    operationId: adminImportRecords
    tags: [admin]
    summary: Import records from NDJSON multipart upload (upsert by id)
    description: |
      Uploads a Record JSONL file and **upserts by `id`** in a **single DB
      transaction**: read the **`file` part into a ≤4 MiB buffer**, then
      line-by-line parse → validate → upsert (not an unbounded HTTP chunk
      stream). Reserved tags are allowed (skips `assertNoReservedTags`).

      Multipart field name **`file`** (exactly one). Accept
      `application/x-ndjson`, `application/jsonl`, or `application/octet-stream`
      with a `.jsonl` filename. Limits: ≤1000 non-empty lines and ≤4 MiB for
      the file part bytes. On Go, non-`file` parts are discarded with the same
      4 MiB cap (`multipart non-file part exceeds size limit (max 4 MiB)`);
      Next relies on runtime `formData()` (platform may buffer the whole
      multipart before handlers run). Empty file / only blank lines → 200 with
      all zeros and still Notify after a successful 200 body. Any failure →
      rollback and no Notify.

      Auth: **AdminToken only**. Does **not** use the 256 KiB JSON body gate
      (`readJsonBody` / `readBody`); large file parts must not return 413 from
      that gate.
    security:
      - AdminToken: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            additionalProperties: true
            properties:
              file:
                type: string
                format: binary
                description: |
                  UTF-8 NDJSON of OpenAPI `Record` objects (one JSON object per
                  non-empty line). Every line must include the `tags` key with
                  an array value; `[]` is allowed, but omitting the key or
                  sending `null` is rejected (`Missing required field: tags` /
                  `Invalid tags`). Legacy stringified-array values
                  (e.g. `"[\"weight\"]"`) are still accepted. Max 1000
                  non-empty lines and 4 MiB.
    responses:
      '200':
        description: |
          Import committed. `total = inserted + updated`. Existing id →
          counted as updated even if values unchanged.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ImportRecordsSuccess'
            example:
              success: true
              inserted: 12
              updated: 3
              total: 15
      '400':
        description: |
          Multipart / limits / duplicate id / line or field validation errors.
          Messages include line numbers and field names when applicable;
          duplicate id includes the uuid. Example `detail` values: `import
          exceeds limits (max 1000 lines or 4 MiB); split the file`, `line 2:
          duplicate record id <uuid>`, `multipart form field "file" is
          required`, `multipart non-file part exceeds size limit (max 4 MiB)`.
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
