/api/admin/tags/rename:
  post:
    operationId: adminRenameTag
    tags: [admin]
    summary: Rename a tag across all records
    description: |
      Exact tag-name replace in each record's tags JSON. If `to` already exists
      on a record, duplicates are removed (first-seen order kept).
      `updated` is the number of records whose tags string changed.
      Reserved tag prefixes (`transaction_entry` / `transaction_entry:*`,
      `body:weight` / `body:weight:*`, `todo` / `todo:*`) are rejected for both `from` and `to`.
      Auth: **AdminToken only**.
    security:
      - AdminToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/RenameTagsRequest'
          example:
            from: weight
            to: mass
    responses:
      '200':
        description: Rename applied
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RenameTagsSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/admin/records/{id}:
  patch:
    operationId: adminPatchRecord
    tags: [admin]
    summary: Replace editable fields of one record
    description: |
      Full editable snapshot replace via `parseRecordDraft` / `draft.ParseRecordDraft`
      (`src/lib/draft.ts`, `faas/internal/draft`).
      `happened_at` **must** include an explicit timezone suffix
      (`Z` or `±HH:MM` / `±HHMM`) — same rule as log endpoints — and at least
      one of `numeric_value` / `raw_content` must be non-null after normalization
      (empty strings → null).
      Auth: **AdminToken only**.
    security:
      - AdminToken: []
    parameters:
      - name: id
        in: path
        required: true
        description: |
          Record UUID (UUIDv7 as stored). Non-UUID → 400 (`Invalid record id`).
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/RecordDraftRequest'
          example:
            happened_at: '2026-07-30T08:00:00+08:00'
            numeric_value: '76'
            raw_content: null
            tags: [weight]
            objective_context: morning weigh-in
            subjective_interpretation: corrected
    responses:
      '200':
        description: Record updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RecordSuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        description: No row with this id
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Record not found
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/admin/import/records:
  post:
    operationId: adminImportRecords
    tags: [admin]
    summary: Import records from NDJSON multipart upload (upsert by id)
    description: |
      Uploads a Record JSONL file and **upserts by `id`** in a **single DB
      transaction**: read the **`file` part into a ≤4 MiB buffer**, then
      line-by-line parse → validate → upsert (not an unbounded HTTP chunk
      stream). Reserved tags are allowed (skips `assertNoReservedTags`);
      Admin PATCH still rejects them.

      Multipart field name **`file`** (exactly one). Accept
      `application/x-ndjson`, `application/jsonl`, or `application/octet-stream`
      with a `.jsonl` filename. Limits: ≤1000 non-empty lines and ≤4 MiB for
      the file part bytes. On Go, non-`file` parts are discarded with the same
      4 MiB cap (`multipart non-file part exceeds size limit (max 4 MiB)`);
      Next relies on runtime `formData()` (platform may buffer the whole
      multipart before handlers run). Empty file / only blank lines → 200 with
      all zeros and still Notify after a successful 200 body. Any failure →
      rollback and no Notify.

      Auth: **AdminToken only**. Does **not** use the 256 KiB JSON body gate
      (`readJsonBody` / `readBody`); large file parts must not return 413 from
      that gate.
    security:
      - AdminToken: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            additionalProperties: true
            properties:
              file:
                type: string
                format: binary
                description: |
                  UTF-8 NDJSON of OpenAPI `Record` objects (one JSON object per
                  non-empty line). Every line must include the `tags` key with
                  an array value; `[]` is allowed, but omitting the key or
                  sending `null` is rejected (`Missing required field: tags` /
                  `Invalid tags`). Legacy stringified-array values
                  (e.g. `"[\"weight\"]"`) are still accepted. Max 1000
                  non-empty lines and 4 MiB.
    responses:
      '200':
        description: |
          Import committed. `total = inserted + updated`. Existing id →
          counted as updated even if values unchanged.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ImportRecordsSuccess'
            example:
              success: true
              inserted: 12
              updated: 3
              total: 15
      '400':
        description: |
          Multipart / limits / duplicate id / line or field validation errors.
          Messages include line numbers and field names when applicable;
          duplicate id includes the uuid.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            examples:
              limits:
                value:
                  error: import exceeds limits (max 1000 lines or 4 MiB); split the file
              duplicateId:
                value:
                  error: 'line 2: duplicate record id 01900000-0000-7000-8000-000000000001'
              multipart:
                value:
                  error: multipart form field "file" is required
              nonFilePartTooLarge:
                summary: Go only — oversized non-file multipart part
                value:
                  error: multipart non-file part exceeds size limit (max 4 MiB)
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
