/api/query:
  get:
    operationId: queryRecords
    tags: [query]
    summary: Query records with filters and pagination
    description: |
      Filters combine with AND. Each `tag` query param matches an exact tag or
      a `name:*` family wildcard (see `QueryTag`); `_` / `%` / `\` in tag are
      escaped for literal match (tag names may contain `_`).
      `q` searches `raw_content`, `objective_context`, `ai_analysis`, and `tags` (LIKE, same escaping).
      When `id` is set, pagination is ignored; returns 0–1 rows with `page: 1`
      and `page_size` equal to the result length (or 1 if empty).
      Results ordered by `happened_at` ascending, then `id` ascending
      (UUIDv7 write order) for stable ties. No `order` query parameter.
      To-do rows in `records[]` use `TodoRecord` aliases (`created_at` /
      `content`) when tags include a todo state tag; audit / other rows stay
      as `Record` (`happened_at` / `raw_content`). See `QuerySuccess.records`.
      Auth: ApiToken.
    security:
      - ApiToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/QueryId'
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryPageSize'
      - $ref: '../components/parameters.yaml#/QueryFrom'
      - $ref: '../components/parameters.yaml#/QueryTo'
      - $ref: '../components/parameters.yaml#/QueryTag'
      - $ref: '../components/parameters.yaml#/QueryQ'
      - $ref: '../components/parameters.yaml#/QuerySortBy'
      - $ref: '../components/parameters.yaml#/QuerySortOrder'
    responses:
      '200':
        description: Filtered page of records
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/QuerySuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/query/tags:
  get:
    operationId: queryTags
    tags: [query]
    summary: Aggregate tag occurrence counts
    description: |
      Returns tag counts as an array ordered by count descending, then tag
      name ascending. Optional `prefix` query param filters to tags starting
      with that string (true prefix; autocomplete — distinct from the
      `tag=X:*` record filter on `/api/query`). Empty DB → `[]`.
      Auth: ApiToken.
    security:
      - ApiToken: []
    parameters:
      - name: prefix
        in: query
        required: false
        description: |
          Keep only tags starting with this string (case-sensitive true
          prefix). `*` is treated literally (no wildcard parsing). E.g.
          `prefix=review:` returns `review:weekly`, `review:monthly`, …
        schema:
          type: string
          examples:
            - review
            - work
    responses:
      '200':
        description: Tag counts
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TagsSuccess'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/query/transactions/summary:
  get:
    operationId: queryTransactionsSummary
    tags: [query]
    summary: Income/expense totals and category breakdown for a time range
    description: |
      Requires `from` and `to` (ISO 8601 with timezone). Aggregates records in
      half-open `[from, to)` whose tags include `transaction_entry:income` or
      `transaction_entry:expense`, plus a valid `{category}:{subcategory}` tag.
      Amounts are signed `numeric_value` sums (reversals cancel); all money fields
      are exactly two-decimal strings. Categories / subcategories sorted by sum
      descending, then name ascending. Dirty rows are skipped.
      Auth: ApiToken.
    security:
      - ApiToken: []
    parameters:
      - name: from
        in: query
        required: true
        description: |
          Inclusive lower bound on `happened_at`. Same ISO+timezone rules as
          other query endpoints. Missing → 400
          (`Missing required query parameter: from`).
          `from >= to` → 400 (`from must be earlier than to`).
        schema:
          type: string
          examples:
            - '2026-07-01T00:00:00+08:00'
      - name: to
        in: query
        required: true
        description: |
          Exclusive upper bound on `happened_at`. Missing → 400
          (`Missing required query parameter: to`).
        schema:
          type: string
          examples:
            - '2026-08-01T00:00:00+08:00'
    responses:
      '200':
        description: Aggregated income/expense summary
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TransactionsSummarySuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
