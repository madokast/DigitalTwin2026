/api/query:
  get:
    operationId: queryRecords
    tags: [query]
    summary: Query records with filters and pagination
    description: |
      Filters combine with AND. Multiple `tag` query params each require that
      tag substring match in the stored tags JSON string (`LIKE %"<tag>"%`);
      `_` / `%` / `\` in tag are escaped for literal match (tag names may contain `_`).
      `q` searches `value_text`, `objective_context`, `subjective_interpretation`, and `tags` (LIKE, same escaping).
      When `id` is set, pagination is ignored; returns 0–1 rows with `page: 1`
      and `page_size` equal to the result length (or 1 if empty).
      Results ordered by `happened_at` ascending, then `id` ascending
      (UUIDv7 write order) for stable ties. No `order` query parameter.
      To-do rows in `records[]` use `TodoRecord` aliases (`created_at` /
      `content`) when tags include a todo state tag; audit / other rows stay
      as `Record` (`happened_at` / `value_text`). See `QuerySuccess.records`.
      Auth: ApiToken.
    security:
      - ApiToken: []
    parameters:
      - $ref: '../components/parameters.yaml#/QueryId'
      - $ref: '../components/parameters.yaml#/QueryPage'
      - $ref: '../components/parameters.yaml#/QueryPageSize'
      - $ref: '../components/parameters.yaml#/QueryFrom'
      - $ref: '../components/parameters.yaml#/QueryTo'
      - $ref: '../components/parameters.yaml#/QueryTag'
      - $ref: '../components/parameters.yaml#/QueryQ'
    responses:
      '200':
        description: Filtered page of records
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/QuerySuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/query/summary:
  get:
    operationId: querySummary
    tags: [query]
    summary: Total and today counts for an IANA time zone
    description: |
      `today` counts records whose `happened_at` falls in the calendar day of
      "now" in the given IANA zone (`[start, end)`).
      Auth: ApiToken.
    security:
      - ApiToken: []
    parameters:
      - name: tz
        in: query
        required: true
        description: |
          Valid IANA time zone accepted by both backends (Intl ∩ Go tzdata),
          e.g. `UTC`, `Asia/Shanghai`. Rejected: Go-only names (`Factory` /
          `localtime` / `posixrules`) and Intl-only names Go cannot load
          (e.g. `America/Coyhaique`) → 400.
        schema:
          type: string
          examples:
            - UTC
            - Asia/Shanghai
    responses:
      '200':
        description: Counts
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SummarySuccess'
      '400':
        description: Missing or invalid `tz`
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
            example:
              error: Query parameter tz must be a valid IANA time zone
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/query/tags:
  get:
    operationId: queryTags
    tags: [query]
    summary: Aggregate tag occurrence counts
    description: |
      Returns a map of tag name → number of records containing that tag,
      sorted lexicographically by tag name. Empty DB → `{ }`.
      Auth: ApiToken.
    security:
      - ApiToken: []
    responses:
      '200':
        description: Tag counts
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TagsSuccess'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

/api/query/transaction/summary:
  get:
    operationId: queryTransactionSummary
    tags: [query]
    summary: Income/expense totals and category breakdown for a time range
    description: |
      Requires `from` and `to` (ISO 8601 with timezone). Aggregates records in
      half-open `[from, to)` whose tags include `transaction_entry:income` or
      `transaction_entry:expense`, plus a valid `{category}:{subcategory}` tag.
      Amounts are signed `value_number` sums (reversals cancel); all money fields
      are exactly two-decimal strings. Categories / subcategories sorted by sum
      descending, then name ascending. Dirty rows are skipped.
      Auth: ApiToken.
    security:
      - ApiToken: []
    parameters:
      - name: from
        in: query
        required: true
        description: |
          Inclusive lower bound on `happened_at`. Same ISO+timezone rules as
          other query endpoints. Missing → 400
          (`Missing required query parameter: from`).
          `from >= to` → 400 (`from must be earlier than to`).
        schema:
          type: string
          examples:
            - '2026-07-01T00:00:00+08:00'
      - name: to
        in: query
        required: true
        description: |
          Exclusive upper bound on `happened_at`. Missing → 400
          (`Missing required query parameter: to`).
        schema:
          type: string
          examples:
            - '2026-08-01T00:00:00+08:00'
    responses:
      '200':
        description: Aggregated income/expense summary
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TransactionSummarySuccess'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
