/api/qqbot/probe:
  post:
    operationId: qqbotProbe
    tags: [qqbot]
    summary: Send a QQ Bot probe message
    description: |
      Requires `QQBOT_APP_ID`, `QQBOT_APP_SECRET`, and `QQBOT_USER_OPENID` on the server.
      Empty / non-JSON body is allowed; default text is `DigitalTwin2026 probe`.
      Auth: ApiToken.
    security:
      - ApiToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/QqbotProbeRequest'
    responses:
      '200':
        description: Message sent
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessOnly'
      '400':
        description: QQ Bot env not configured (or other client error)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '502':
        description: QQ Bot API send failed
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
