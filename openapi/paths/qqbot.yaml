/api/qqbot/probe:
  post:
    operationId: qqbotProbe
    tags: [qqbot]
    summary: Send a QQ Bot probe message
    description: |
      Requires `QQBOT_APP_ID`, `QQBOT_APP_SECRET`, and `QQBOT_USER_OPENID` on the server.
      Empty body is allowed and sends the default text `DigitalTwin2026 probe`;
      a non-empty body must be a JSON object with optional `text`
      (malformed JSON or trailing garbage → 400).
      Auth: ApiToken.
    security:
      - ApiToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/QqbotProbeRequest'
    responses:
      '200':
        description: Message sent
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/SuccessOnly'
      '400':
        description: QQ Bot env not configured, malformed JSON, or unknown JSON key
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '413':
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      '502':
        description: QQ Bot API send failed
        $ref: '../components/responses.yaml#/BadGateway'
