BadRequest:
  description: Validation or malformed request
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Bad Request
        status: 400
        detail: 'missing required query parameter: from'
Unauthorized:
  description: Missing/invalid Bearer token for this route class
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Unauthorized
        status: 401
        detail: 'Unauthorized: Invalid or missing token'
NotFound:
  description: Referenced resource does not exist
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Not Found
        status: 404
        detail: to-do not found
PayloadTooLarge:
  description: Request body exceeds the 256 KiB limit
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Payload Too Large
        status: 413
        detail: Request body too large
InternalError:
  description: Unexpected server/database error
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Internal Server Error
        status: 500
        detail: Internal server error
BadGateway:
  description: Upstream chat API call failed
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Bad Gateway
        status: 502
        detail: 'telegram sendMessage failed: chat not found'
ServiceUnavailable:
  description: Database unreachable or unconfigured
  content:
    application/problem+json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        success: false
        title: Service Unavailable
        status: 503
        detail: DATABASE_URL is not set
