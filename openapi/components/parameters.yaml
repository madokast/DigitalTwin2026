QueryId:
  name: id
  in: query
  required: false
  description: |
    Exact record UUID; when set, pagination params are ignored.
    Non-UUID → 400 (`Invalid record id`).
  schema:
    type: string
    format: uuid
QueryPage:
  name: page
  in: query
  required: false
  description: 1-based page index (default 1)
  schema:
    type: integer
    minimum: 1
    default: 1
QueryPageSize:
  name: page_size
  in: query
  required: false
  description: Page size (default 20, max 100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
QueryFrom:
  name: from
  in: query
  required: false
  description: |
    Inclusive lower bound on `happened_at`. Must be ISO 8601 **with timezone**
    (`Z` or `±HH:MM` / `±HHMM`). Error examples:
    `from must be ISO 8601 with timezone (Z or ±HH:MM)`,
    `Invalid from datetime`.
  schema:
    type: string
    examples:
      - '2026-07-01T00:00:00Z'
      - '2026-07-01T00:00:00+08:00'
QueryTo:
  name: to
  in: query
  required: false
  description: |
    Exclusive upper bound on `happened_at`. Same ISO+timezone rules as `from`.
  schema:
    type: string
    examples:
      - '2026-08-01T00:00:00Z'

QuerySortBy:
  name: sort_by
  in: query
  required: false
  description: |
    Sort column: `happened_at` (default) or `id`. Anything else → 400
    (`sort_by must be one of: happened_at, id`). Empty value → 400.
  schema:
    type: string
    enum: [happened_at, id]
    default: happened_at
QuerySortOrder:
  name: sort_order
  in: query
  required: false
  description: |
    Sort direction: `asc` (default) or `desc` (strict lowercase; `ASC`/empty
    → 400 `sort_order must be one of: asc, desc`). `happened_at` desc keeps
    `id ASC` as tie-breaker; `id` sort has no secondary key.
  schema:
    type: string
    enum: [asc, desc]
    default: asc
QueryTag:
  name: tag
  in: query
  required: false
  description: |
    Repeatable. Each value requires the tag to appear in the tags JSON string.
    Example: `?tag=weight&tag=source:device`
  schema:
    type: string
  style: form
  explode: true
QueryQ:
  name: q
  in: query
  required: false
  description: Substring search across text fields and tags JSON
  schema:
    type: string
ExportFrom:
  name: from
  in: query
  required: false
  description: |
    Inclusive cursor UUID (`WHERE id >= from`). Omit = start from the smallest
    `id` at request time. Non-UUID → 400 (`Invalid record id`). Valid UUID with
    no matching row → 404 (`export from id not found`).
  schema:
    type: string
    format: uuid
ExportLimit:
  name: limit
  in: query
  required: true
  description: |
    Page size. Required integer **1 ≤ limit ≤ 1000**. Missing or out of range
    → 400 (`limit must be an integer between 1 and 1000`).
  schema:
    type: integer
    minimum: 1
    maximum: 1000
