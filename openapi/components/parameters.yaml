QueryId:
  name: id
  in: query
  required: false
  description: |
    Exact record UUID; when set, pagination params are ignored.
    Non-UUID → 400 (`Invalid record id`).
  schema:
    type: string
    format: uuid
QueryPage:
  name: page
  in: query
  required: false
  description: 1-based page index (default 1)
  schema:
    type: integer
    minimum: 1
    default: 1
QueryPageSize:
  name: page_size
  in: query
  required: false
  description: Page size (default 20, max 100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
QueryFrom:
  name: from
  in: query
  required: false
  description: |
    Inclusive lower bound on `happened_at`. Must be ISO 8601 **with timezone**
    (`Z` or `±HH:MM` / `±HHMM`). Error examples:
    `from must be ISO 8601 with timezone (Z or ±HH:MM)`,
    `Invalid from datetime`.
  schema:
    type: string
    examples:
      - '2026-07-01T00:00:00Z'
      - '2026-07-01T00:00:00+08:00'
QueryTo:
  name: to
  in: query
  required: false
  description: |
    Exclusive upper bound on `happened_at`. Same ISO+timezone rules as `from`.
  schema:
    type: string
    examples:
      - '2026-08-01T00:00:00Z'

QuerySortBy:
  name: sort_by
  in: query
  required: false
  description: |
    Sort column: `happened_at` (default) or `id`. Anything else → 400
    (`sort_by must be one of: happened_at, id`). Empty value → 400.
  schema:
    type: string
    enum: [happened_at, id]
    default: happened_at
QuerySortOrder:
  name: sort_order
  in: query
  required: false
  description: |
    Sort direction: `asc` (default) or `desc` (strict lowercase; `ASC`/empty
    → 400 `sort_order must be one of: asc, desc`). `happened_at` desc keeps
    `id ASC` as tie-breaker; `id` sort has no secondary key.
  schema:
    type: string
    enum: [asc, desc]
    default: asc
QueryTag:
  name: tag
  in: query
  required: false
  description: |
    Repeatable, AND-combined. Each value must be a valid tag name or a
    family wildcard `name:*`.
    - `tag=weight` → exact tag match (`LIKE %"weight"%`).
    - `tag=weight:*` → family match, all tags with the `weight:` prefix
      (`LIKE %"weight:%`; e.g. `workout:arm` matched by `workout:*`). The
      wildcard is only valid as a trailing `:*`; a bare `*`, mid-string `*`,
      multiple `*`, or a trailing `*` without a colon → 400
      (`Invalid tag query "<value>": use a valid tag name or a family pattern
      "tag=review:*" (a single "*" at the end, prefix must be non-empty)`).
    - Querying a bare reserved prefix that is never stored (`transaction_entry`,
      `todo`, `review`) returns 200 with empty records and a `hint` field
      telling the caller to use `tag=<name>:*`. `body:weight` is the exception
      (the bare tag is stored, so it matches normally and gets no hint).
    `_` / `%` / `\` in tag are escaped for literal match (tag names may contain `_`).
    Example: `?tag=weight&tag=source:device`
  schema:
    type: string
  style: form
  explode: true
QueryQ:
  name: q
  in: query
  required: false
  description: Substring search across text fields and tags JSON
  schema:
    type: string
ExportFrom:
  name: from
  in: query
  required: false
  description: |
    Inclusive cursor UUID (`WHERE id >= from`). Omit = start from the smallest
    `id` at request time. Non-UUID → 400 (`Invalid record id`). Valid UUID with
    no matching row → 404 (`export from id not found`).
  schema:
    type: string
    format: uuid
ExportLimit:
  name: limit
  in: query
  required: true
  description: |
    Page size. Required integer **1 ≤ limit ≤ 1000**. Missing or out of range
    → 400 (`limit must be an integer between 1 and 1000`).
  schema:
    type: integer
    minimum: 1
    maximum: 1000
