openapi: 3.1.0
info:
  title: DigitalTwin2026 HTTP API
  version: 0.1.0
  summary: Dual-backend HTTP contract (Next.js on Vercel + Go on Alibaba Cloud FC)
  description: |
    Source of truth for paths, methods, auth, request/response shapes shared by:

    - Next.js Route Handlers (`src/app/api/**`) on Vercel
    - Go HTTP server (`faas/internal/**`) on Alibaba Cloud Function Compute

    Success responses use `{ "success": true, ... }`.
    Errors use `{ "error": "<English message>" }`.

    Request JSON fields are **snake_case**. Stored/returned `Record` objects use
    **snake_case** (Drizzle / Go `record.Record` JSON tags).

    `Record.tags` is a **JSON array encoded as a string** (e.g. `"[\"weight\"]"`),
    not a JSON array value. `Record.numeric_value` is a decimal string or null
    (see `Record.numeric_value` description for write/read rules).

    Auth is enforced before handlers (Next `src/proxy.ts`; FC `httpx.withAuth`).
  license:
    name: UNLICENSED

servers:
  - url: /
    description: Same-origin Next.js (Vercel) or local `next dev`
  - url: '{accelerateBase}'
    description: Optional API Accelerate base (FC). Set in web Settings; do not commit real FC URLs.
    variables:
      accelerateBase:
        default: http://localhost:8080

tags:
  - name: log
    description: Insert numeric or text life records (AI / client logging)
  - name: query
    description: List, summarize, and aggregate tags
  - name: time
    description: Current wall-clock time for AI models (ApiToken)
  - name: telegram
    description: Telegram Bot connectivity probe
  - name: qqbot
    description: QQ Bot connectivity probe
  - name: db
    description: Postgres connectivity probe
  - name: admin
    description: Admin-only corrections and Record JSONL import (AdminToken only)
  - name: export
    description: Cursor-paginated Record JSONL file download (ApiToken)

