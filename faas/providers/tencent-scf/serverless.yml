# 控制台先建无 CLS 的 Web 函数 digitaltwin-api-test，再由此更新代码。
# 业务密钥不写进本文件：deploy 时拷贝 .env.scf.* → .scf-build/.env，由 scf_bootstrap source。

component: scf
name: digitaltwin-api
org: digitaltwin2026
app: digitaltwin-api
stage: test

inputs:
  name: digitaltwin-api-test
  type: web
  region: ap-guangzhou
  runtime: CustomRuntime
  description: DigitalTwin2026 HTTP API (Go Web on SCF)
  memorySize: 64
  timeout: 30
  initTimeout: 65
  src: ./.scf-build
  environment:
    variables:
      PORT: '9000'
