# 控制台先建无 CLS 的 Web 函数；函数名来自 env 文件 SCF_FUNCTION_NAME（deploy overlay 覆盖）。
# 密钥：--env-file 内容打进 .scf-build/.env，exit 删除；勿写 YAML environment。

component: scf
name: digitaltwin-api
org: digitaltwin2026
app: digitaltwin-api

inputs:
  name: digitaltwin-api-${stage}
  type: web
  region: ap-guangzhou
  runtime: CustomRuntime
  description: DigitalTwin2026 HTTP API (Go Web on SCF)
  memorySize: 64
  timeout: 30
  initTimeout: 65
  src: ./.scf-build
  environment:
    variables:
      PORT: '9000'
