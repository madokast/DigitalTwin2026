name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  openapi:
    name: OpenAPI lint + contract (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run openapi:lint
      - run: npm run test:openapi

  unit-node:
    name: Typecheck + Unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 无安全 DATABASE_URL：tests/api 会 skip（与 Go integration Skip 对齐）；仍跑 src/lib 等单元测
      - run: npm test

  go-contract:
    name: OpenAPI contract (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: faas/go.mod
          cache-dependency-path: faas/go.sum
      - working-directory: faas
        run: go test ./internal/contract/ -count=1 -race

  unit-go:
    name: Unit tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: faas/go.mod
          cache-dependency-path: faas/go.sum
      - working-directory: faas
        # httpx integration 在无 DATABASE_URL 时 Skip
        run: go test ./... -count=1 -race

  lint-go:
    name: Lint (Go, golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: faas/go.mod
          cache-dependency-path: faas/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          working-directory: faas

  api-integration:
    name: API integration (Node, optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run API integration tests
        env:
          # 可选 GitHub secret：DATABASE_URL（须为测试库；host/库名含 test）
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIGITAL_TWIN_TOKEN: ${{ secrets.TEST_DIGITAL_TWIN_TOKEN }}
          DIGITAL_TWIN_ADMIN_TOKEN: ${{ secrets.TEST_DIGITAL_TWIN_ADMIN_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set; skipping API integration"
            echo "Point DATABASE_URL at a test database (hostname or database name must contain \"test\")."
            exit 0
          fi
          npx vitest run tests/api
