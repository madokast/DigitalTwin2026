# s deploy --env test|prod
# overlays.resources.<name> 下的字段会合并进该资源的 props（不要再包一层 props:）
environments:
  - name: test
    description: FC test → 测试库
    type: testing
    overlays:
      resources:
        api:
          functionName: digitaltwin-api-test
  - name: prod
    description: FC prod → 与 Vercel 同一生产库
    type: production
    overlays:
      resources:
        api:
          functionName: digitaltwin-api-prod
