# s deploy --env test|prod
# 仅覆盖函数名；密钥仍来自本机 export / .env.fc.*
environments:
  - name: test
    description: FC test → 测试库
    type: testing
    overlays:
      resources:
        api:
          props:
            functionName: digitaltwin-api-test
  - name: prod
    description: FC prod → 与 Vercel 同一生产库
    type: production
    overlays:
      resources:
        api:
          props:
            functionName: digitaltwin-api-prod
