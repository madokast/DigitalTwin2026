# s deploy --env test|prod
# overlays.resources.<name> 下的字段会合并进该资源的 props（不要再包一层 props:）
environments:
  - name: test
    description: FC test → test database
    type: testing
    overlays:
      resources:
        api:
          functionName: digitaltwin-api-test
  - name: prod
    description: FC prod → same production database as Vercel
    type: production
    overlays:
      resources:
        api:
          functionName: digitaltwin-api-prod
